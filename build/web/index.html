<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FG Academy Portal — Evening Coaching Classes management system for teachers and administrators.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FG Academy Portal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FG Academy Portal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #0D2247;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #loading {
      color: #C9A84C;
      font-family: sans-serif;
      font-size: 14px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    #loading p { color: rgba(255,255,255,0.6); margin-top: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="loading">
    FG Academy Portal
    <p>Loading…</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>
</body>
</html>
