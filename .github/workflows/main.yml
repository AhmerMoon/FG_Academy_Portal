name: Build Academy Portal

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Agar jaldi jaldi multiple pushes hon,
# sirf newest build release hogi.
concurrency:
  group: fg-academy-portal-release
  cancel-in-progress: true

jobs:
  # ==========================================================
  # ANDROID APK
  # ==========================================================
  build-android:
    runs-on: ubuntu-latest

    outputs:
      version_code: ${{ steps.android_version.outputs.version_code }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Restore Permanent Signing Key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/fgacademy-release.jks

          test -s android/app/fgacademy-release.jks

          echo "Signing keystore restored."

      # New build number automatically on every new push.
      - name: Calculate Android Build Number
        id: android_version
        shell: bash
        run: |
          echo "version_code=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      # Sign APK and embed GitHub repository name.
      - name: Build Signed Release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          flutter build apk --release \
            --build-number="${{ steps.android_version.outputs.version_code }}" \
            --dart-define="GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            FG_Academy_Portal.apk

      - name: Verify APK Signature
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_DIR" ]; then
            echo "ERROR: Android SDK location unavailable."
            exit 1
          fi

          APKSIGNER="$(
            find "$SDK_DIR/build-tools" \
              -type f -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --print-certs FG_Academy_Portal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: FG_Academy_Portal.apk
          if-no-files-found: error

  # ==========================================================
  # WINDOWS DESKTOP APPLICATION
  # ==========================================================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Add Local Automation Backend
        shell: powershell
        run: |
          $release = "build\windows\x64\runner\Release"
          $backend = "$release\FGEI_Backend"
          $feeData = "$release\Fee_Data"

          New-Item -ItemType Directory -Force -Path $backend
          New-Item -ItemType Directory -Force -Path $feeData

          Copy-Item "FGEI_Backend\main.py" `
            "$backend\main.py" -Force

          Copy-Item "FGEI_Backend\main.bat" `
            "$backend\main.bat" -Force

          Copy-Item "FGEI_Backend\setup_backend.bat" `
            "$backend\setup_backend.bat" -Force

          Copy-Item "FGEI_Backend\requirements.txt" `
            "$backend\requirements.txt" -Force

          Copy-Item "FGEI_Backend\fee_excel_bridge.py" `
            "$backend\fee_excel_bridge.py" -Force

          @"
          FG Academy Local Fee Data

          Put monthly Excel workbooks in this folder.

          Required naming:
          Fee_2026-09.xlsx
          Fee_2026-10.xlsx
          Fee_2026-11.xlsx

          Excel workbooks are intentionally NOT included
          in the GitHub release.
          "@ | Set-Content "$feeData\PUT_FEE_FILES_HERE.txt"

          Write-Host "Backend files:"
          Get-ChildItem $backend

          Write-Host "Fee data folder:"
          Get-ChildItem $feeData

      - name: Create Windows ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "Academy_Portal_Windows.zip" `
            -Force

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-ZIP
          path: Academy_Portal_Windows.zip
          if-no-files-found: error

  # ==========================================================
  # AUTOMATIC GITHUB RELEASE
  # ==========================================================
  create-release:
    needs:
      - build-android
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Android-APK
          path: release-assets/android

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: Windows-ZIP
          path: release-assets/windows

      - name: Create Latest Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-assets/android/FG_Academy_Portal.apk,release-assets/windows/Academy_Portal_Windows.zip"

          artifactErrorsFailBuild: true

          # Every build gets a unique tag.
          tag: "android-${{ needs.build-android.outputs.version_code }}"
          commit: ${{ github.sha }}

          name: "FG Academy Portal - Latest Update"

          body: |
            Latest FG Academy Portal release.

            Downloads:
            - FG_Academy_Portal.apk
            - Academy_Portal_Windows.zip

            Windows package includes:
            - WhatsApp reporting backend
            - Excel Fees test bridge
            - Empty Fee_Data folder

            Local .env files and financial Excel workbooks
            are intentionally not included.

          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
